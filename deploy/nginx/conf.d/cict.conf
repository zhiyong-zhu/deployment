# WebSocket 升级透传：Connection 头需随 Upgrade 头有无动态取值。
# map 必须位于 http 上下文，本文件被 nginx.conf include 在 http{} 内，故放在文件顶部。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root   /usr/share/nginx/html;
    index  index.html;

    # docker 内嵌 DNS。配合下方变量形式的 proxy_pass，上游主机名在"请求时"解析，
    # 而非 nginx 加载配置时——否则语法校验（install.sh 的 compose run --no-deps nginx -t）
    # 或启动早于依赖容器会直接 host not found in upstream 退出，
    # 且依赖容器重建换 IP 后必须 reload nginx 才能恢复。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量形式的 proxy_pass 不支持 URI 改写，/api/<path> → /<path> 的前缀剥离
    # （等价于原静态写法 proxy_pass http://cict:9090/ 的尾斜杠语义）由 rewrite 完成。
    # set 必须写在 rewrite ... break 之前：break 会中止其后 rewrite 模块指令的执行，
    # set 属于该模块，写在后面会被跳过（proxy_pass 得到空串 → 500 invalid URL prefix）
    location /api/ {
        set $cict_api http://cict:9090;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $cict_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # SockJS/WebSocket 端点（后端 Spring 的 /ws）。不代理时 POST /ws/** 落到静态 location
    # 返回 405、websocket 升级拿到 index.html；xhr_streaming 等降级传输还要求关闭缓冲与 gzip。
    location ^~ /ws {
        set $cict_ws http://cict:9090;
        proxy_pass $cict_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # S3 浏览器直传/下载：桶 pike 的 path-style 预签 URL（http://<对外地址>/pike/<key>）。
    # proxy_pass 用变量形式且不带 URI：请求路径与 Host 原样转发到 RustFS，SigV4 签名校验
    # 才会通过（改写路径或 Host 都会 403 SignatureDoesNotMatch）。
    # ^~ 使本前缀优先于下方静态后缀正则，否则 .png 等对象会被 try_files 吞成 index.html。
    location ^~ /pike/ {
        set $rustfs_s3 http://rustfs:9000;
        proxy_pass $rustfs_s3;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
    }
}
